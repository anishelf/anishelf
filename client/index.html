<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">

        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Basic SEO -->
        <title>Ani-Shelf</title>
        <meta name="description" content="AniShelf is an anime discovery and library platform where you can create, save, share, and publish anime lists, discover recommendations, and use AI image search to identify anime.">
        <meta name="robots" content="index, follow">
        <!-- Favicon -->
        <link rel="icon" type="image/png" href= "https://ani-shelf.com/assets/favicon/favicon.png">

        <link rel="apple-touch-icon" href= "https://ani-shelf.com/assets/favicon/favicon.png">

        <!-- Google Font -->
        <link rel="preconnect" href="https://fonts.googleapis.com">

        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

        <!-- CSS -->
        <link rel="stylesheet" href="css/base/variable.css">
        <link rel="stylesheet" href="css/base/reset.css">
        <link rel="stylesheet" href="css/base/global.css">

        <link rel="stylesheet" href="css/components/navbar.css">
        <link rel="stylesheet" href="css/components/hero.css">
        <link rel="stylesheet" href="css/components/shelves.css">
        <link rel="stylesheet" href="css/components/slider.css">
        <link rel="stylesheet" href="css/components/animeCards.css">
        <link rel="stylesheet" href="css/components/dropdown.css">
        <link rel="stylesheet" href="css/components/button.css">

        <link rel="stylesheet" href="css/responsive.css">

        <link rel="stylesheet" href="css/pages/home.css">
        <link rel="stylesheet" href="assets/modal/css/modal.css">
        <link rel="stylesheet" href="assets/modal/css/modalShare.css">

        <!-- AniShelf identity -->
        <script type="application/ld+json">{
            "@context": "https://schema.org",
            "@type": "WebSite",
            "name": "Ani-Shelf",
            "alternateName": "Ani-Shelf Anime Library",
            "url": "https://ani-shelf.com",    
            "description": "Ani-Shelf is an anime discovery and library platform where you can create, save, share, and publish anime lists, discover recommendations, and use AI image search to identify anime."
        }
        </script>

        <script type="application/ld+json">{
            "@context": "https://schema.org",
            "@graph": [
                {
                    "@type": "Organization",
                    "@id": "https://ani-shelf.com/#organization",
                    "name": "Ani-Shelf",
                    "url": "https://ani-shelf.com/",
                    "logo": {
                        "@type": "ImageObject",
                        "url": "https://ani-shelf.com/assets/favicon/favicon.png"
                    },
                    "description": "Ani-Shelf is an anime discovery and library platform where users can create, save, share, and publish anime lists, discover recommendations, and use AI-powered image search to identify anime."
                },

                {
                    "@type": "WebSite",
                    "@id": "https://ani-shelf.com/#website",
                    "url": "https://ani-shelf.com/",
                    "name": "Ani-Shelf",
                    "alternateName": "Ani-Shelf Anime Library",
                    "description": "Ani-Shelf is an anime discovery and library platform where users can create, save, share, and publish anime lists, discover recommendations, and use AI-powered image search to identify anime.",
                    "publisher": {
                        "@id": "https://ani-shelf.com/#organization"
                    }
                }

            ]
        }
        </script>
    </head>

    <body>
        <!-- ========================= -->
        <!-- Navbar -->
        <!-- ========================= -->
        <nav class="navbar">

            <div class="logo">
                AniShelf
            </div>


            <button
                class="nav-toggle"
                id="navToggle"
                aria-label="Open navigation"
                aria-expanded="false"
            >
                ☰
            </button>


            <ul class="nav-links" id="navLinks">
            </ul>

        </nav>
        <!-- ========================= -->
        <!-- Hero Section -->
        <!-- ========================= -->
        <section class="hero" id="featuredHero">

            <div class="hero-content">

                <h1 id="featuredTitle">
                    Loading anime...
                </h1>
                <p id="featuredDescription">
                    Discovering something amazing...
                </p>
                <div class="hero-info">
                    <span id="featuredScore">
                        ⭐ --
                    </span>
                    <span id="featuredYear">
                        --
                    </span>
                </div>
                <!-- search -->
                <div class="search-box">
                    <input
                    type="text"
                    id="searchInput"
                    placeholder="Search anime...">
                </div>
                <div class="hero-bottom">
                    <!--CAROUSEL DOTS -->
                    <div
                        id="heroIndicators"
                        class="hero-indicators">
                    </div>
                    <!-- HERO BUTTONS -->
                    <div class="hero-buttons">
                        <a
                            id="heroDetailsBtn"
                            class="hero-btn primary">
                            ▶ View Details
                        </a>
                        <button
                            id="heroListBtn"
                            class="hero-btn secondary">
                            ➕ Add To List
                        </button>

                    </div>
                </div>
            </div>
        </section>
        <!-- trending anime-->
        <section class="anime-section">
            <div class="section-header">
                <h2>Trending Anime</h2>
            </div>
            <div class="slider-wrapper">
                <button
                    class="slider-btn left"
                    data-target="trendingContainer">
                    &#10094;
                </button>
                <div
                    class="anime-container slider"
                    id="trendingContainer">
                </div>

                <button
                    class="slider-btn right"
                    data-target="trendingContainer">
                    &#10095;
                </button>
            </div>
        </section>
        <!-- new releases -->
        <section class="anime-section">
            <div class="section-header">
                <h2>New Releases</h2>
            </div>
            <div class="slider-wrapper">
                <button
                    class="slider-btn left"
                    data-target="newContainer">
                    &#10094;
                </button>
                <div
                    class="anime-container slider"
                    id="newContainer">
                </div>
                <button
                    class="slider-btn right"
                    data-target="newContainer">
                    &#10095;
                </button>
            </div>
        </section>
        <!-- Top Rated -->
        <section class="anime-section">
            <div class="section-header">
                <h2>Top Rated</h2>
            </div>
            <div class="slider-wrapper">
                <button class="slider-btn left"
                data-target="topRatedContainer">
                    &#10094;
                </button>
                <div
                    class="anime-container slider"
                    id="topRatedContainer">

                </div>
                <button class="slider-btn right"
                data-target="topRatedContainer">
                    &#10095;
                </button>
            </div>
        </section>
        <!-- Anime Movies -->
        <section class="anime-section">
            <div class="section-header">
                <h2>Anime Movies </h2>
            </div>
            <div class="slider-wrapper">
                <button class="slider-btn left"
                data-target="moviesContainer">
                    &#10094;
                </button>
                <div
                    class="anime-container slider"
                    id="moviesContainer">
                </div>
                <button class="slider-btn right"
                data-target="moviesContainer">
                    &#10095;
                </button>
            </div>
        </section>
        <!-- Horror Anime -->
        <section class="anime-section">
            <div class="section-header">
                <h2>Horror Anime</h2>
            </div>
            <div class="slider-wrapper">
                <button class="slider-btn left"
                data-target="horrorContainer">
                    &#10094;
                </button>
                <div
                    class="anime-container slider"
                    id="horrorContainer">
                </div>
                <button class="slider-btn right"
                data-target="horrorContainer">
                    &#10095;
                </button>
            </div>
        </section>
        <!-- Upcoming Anime -->
        <section class="anime-section">
            <div class="section-header">
                <h2>Upcoming Anime</h2>
            </div>
            <div class="slider-wrapper">
                <button class="slider-btn left"
                data-target="upcomingContainer">
                    &#10094;
                </button>
                <div
                    class="anime-container slider"
                    id="upcomingContainer">
                </div>
                <button class="slider-btn right"
                data-target="upcomingContainer">
                    &#10095;
                </button>
            </div>           
        </section>
        <!--modal-->
        <div id="globalModal"></div>
        <!-- JavaScript -->
        <script src="assets/modal/js/modal.js"></script>

        <script src="js/api/animeApi.js"></script>
        <script src="js/api/authApi.js"></script>
        <script src="js/api/listApi.js"></script>

        <script src="js/componenets/navbar.js"></script>
        <script src="js/componenets/animeCard.js"></script>
        <script src="js/componenets/dropdown.js"></script>
        <script src="js/componenets/cardActions.js"></script>

        <script src="js/ui.js"></script>

        <script src="js/componenets/featuredHero.js"></script>
        <script src="js/componenets/slider.js"></script>

        <script src="js/pages/home.js"></script>

    </body>

</html>
