<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AniShelf</title>

    <!-- Google Font -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/hero.css">
    <link rel="stylesheet" href="css/cards.css">
    <link rel="stylesheet" href="css/responsive.css">

</head>

<body>

    <!-- ========================= -->
    <!-- Navbar -->
    <!-- ========================= -->

    <nav class="navbar">

        <div class="logo">
            AniShelf
        </div>

        <ul class="nav-links">

            <li><a href="index.html">Home</a></li>

            <li><a href="search.html">Search</a></li>

            <li><a href="#">Top Rated</a></li>

            <li><a href="#">About</a></li>

        </ul>

    </nav>

    <!-- ========================= -->
    <!-- Hero Section -->
    <!-- ========================= -->
    <section class="hero" id="featuredHero">

        <div class="hero-content">

            <h1 id="featuredTitle">
                Loading anime...
            </h1>


            <p id="featuredDescription">
                Discovering something amazing...
            </p>


            <div class="hero-info">

                <span id="featuredScore">
                    ⭐ --
                </span>


                <span id="featuredYear">
                    --
                </span>

            </div>


            <div class="search-box">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search anime...">


                <button id="searchBtn">

                    Search

                </button>

            </div>

        </div>

    </section>

    <section class="anime-section">

        <div class="section-header">

            <h2>🔥 Trending Anime</h2>

        </div>

        <div class="slider-wrapper">

            <button
                class="slider-btn left"
                data-target="trendingContainer">

                &#10094;

            </button>

            <div
                class="anime-container slider"
                id="trendingContainer">

            </div>

            <button
                class="slider-btn right"
                data-target="trendingContainer">

                &#10095;

            </button>

        </div>

    </section>


    <section class="anime-section">

        <div class="section-header">

            <h2>✨ New Releases</h2>

        </div>

        <div class="slider-wrapper">

            <button
                class="slider-btn left"
                data-target="newContainer">

                &#10094;

            </button>

            <div
                class="anime-container slider"
                id="newContainer">

            </div>

            <button
                class="slider-btn right"
                data-target="newContainer">

                &#10095;

            </button>

        </div>

    </section>
    


    <section class="anime-section">

        <div class="section-header">

            <h2>⭐ Top Rated</h2>

        </div>

        <div class="slider-wrapper">

            <button class="slider-btn left"
            data-target="topRatedContainer">

                &#10094;

            </button>

            <div
                class="anime-container slider"
                id="topRatedContainer">

            </div>

            <button class="slider-btn right"
            data-target="topRatedContainer">

                &#10095;

            </button>

        </div>

    </section>

    <section class="anime-section">

        <div class="section-header">

            <h2>🎥 Anime Movies </h2>

        </div>

        <div class="slider-wrapper">

            <button class="slider-btn left"
            data-target="moviesContainer">

                &#10094;

            </button>

            <div
                class="anime-container slider"
                id="moviesContainer">

            </div>

            <button class="slider-btn right"
            data-target="moviesContainer">

                &#10095;

            </button>

        </div>

    </section>




    <section class="anime-section">

        <div class="section-header">

            <h2>👻 Horror Anime</h2>

        </div>

        <div class="slider-wrapper">

            <button class="slider-btn left"
            data-target="horrorContainer">

                &#10094;

            </button>

            <div
                class="anime-container slider"
                id="horrorContainer">

            </div>

            <button class="slider-btn right"
            data-target="horrorContainer">

                &#10095;

            </button>

        </div>

    </section>



    <section class="anime-section">

        <div class="section-header">

            <h2>📅 Upcoming Anime</h2>

        </div>

        <div class="slider-wrapper">

            <button class="slider-btn left"
            data-target="upcomingContainer">

                &#10094;

            </button>

            <div
                class="anime-container slider"
                id="upcomingContainer">

            </div>

            <button class="slider-btn right"
            data-target="upcomingContainer">

                &#10095;

            </button>

        </div>

    </section>








    <!-- JavaScript -->

    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/slider.js"></script>
    <script src="js/utils.js"></script>

    <script src="js/app.js"></script>

</body>

</html>
