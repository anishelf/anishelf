<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        AniShelf | Login
    </title>

    <link rel="stylesheet" href="css/base/global.css">
    <link rel="stylesheet" href="css/base/reset.css">
    <link rel="stylesheet" href="css/base/variable.css">

    <link rel="stylesheet" href="css/components/navbar.css">
    <link rel="stylesheet" href="css/pages/auth.css">

</head>

<body>

    <nav class="navbar">

        <div class="logo">

            AniShelf

        </div>

        <ul
        class="nav-links"
        id="navLinks">

        </ul>

    </nav>

    <!-- LOGIN CONTENT GOES HERE -->

    <main class="auth-page">

        <div class="auth-card">

            <!-- login form -->
            <main class="auth-page">
            
            
            
                <div class="auth-card">
            
                    <h1>Welcome Back</h1>
            
                    <p>
                        Log in to access your library and profile.
                    </p>
            
                    <form id="loginForm">
            
                        <input
                            type="email"
                            id="email"
                            placeholder="Email"
                            required
                        >
            
                        <input
                            type="password"
                            id="password"
                            placeholder="Password"
                            required
                        >
            
                        <button type="submit">
            
                            Login
            
                        </button>
            
                    </form>
            
                    <p class="auth-link">
            
                        Don't have an account?
            
                        <a href="signup.html" class="auth-link">
                            Sign Up
                        </a>
            
                    </p>
            
                </div>
            
            </main>

        </div>

    </main>

    <script src="js/componenets/navbar.js"></script>

    <script src="js/api/authApi.js"></script>
    <script src="js/pages/login.js"></script>

</body>

</html>
