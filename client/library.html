<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta  name="viewport"content="width=device-width, initial-scale=1.0">
    <title>AniShelf | My Library</title>

    <link rel="stylesheet" href="css/base/variable.css">
    <link rel="stylesheet" href="css/base/reset.css">
    <link rel="stylesheet" href="css/base/global.css">

    <link rel="stylesheet" href="css/components/navbar.css">
    <link rel="stylesheet" href="css/components/button.css">


    <link rel="stylesheet" href="css/pages/library.css">


    <link rel="stylesheet" href="assets/modal/css/modal.css">

</head>


<body>


    <!-- =========================
    NAVBAR
    ========================= -->

    <nav class="navbar">

        <div class="logo">
            AniShelf
        </div>


        <ul
            class="nav-links"
            id="navLinks"
        ></ul>

    </nav>



    <!-- =========================
    LIBRARY
    ========================= -->

    <main class="library-page">


        <div class="library-header">

            <div>

                <h1>
                    My Library
                </h1>

                <p>
                    Your personal anime lists
                </p>

            </div>


            <button
                id="createListBtn"
                class="anime-btn"
            >

                + Create List

            </button>

        </div>



        <!-- =========================
        LISTS
        ========================= -->

        <section
            id="libraryLists"
            class="library-grid"
        >

            <!-- Lists generated by library.js -->

        </section>


    </main>



    <!-- =========================
    GLOBAL MODAL
    ========================= -->

    <div id="globalModal"></div>



    <!-- =========================
    JAVASCRIPT
    ========================= -->

    <!-- Modal system -->
    <script
        src="assets/modal/js/modal.js"
    ></script>


    <!-- API -->
    <script
        src="js/api/authApi.js"
    ></script>

    <script
        src="js/api/listApi.js"
    ></script>


    <!-- Components -->
    <script
        src="js/componenets/navbar.js"
    ></script>

    <script
        src="js/componenets/animeCard.js"
    ></script>

    <script
        src="js/componenets/cardActions.js"
    ></script>


    <!-- Page -->
    <script
        src="js/pages/library.js"
    ></script>


</body>

</html>
