<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>AniShelf - Community</title>

<!-- Google Font -->

<link rel="preconnect"
    href="https://fonts.googleapis.com">

<link rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">


<!-- Base CSS -->

<link rel="stylesheet"
    href="css/base/variable.css">

<link rel="stylesheet"
    href="css/base/reset.css">

<link rel="stylesheet"
    href="css/base/global.css">


<!-- Components -->

<link rel="stylesheet"
    href="css/components/navbar.css">

<link rel="stylesheet"
    href="css/responsive.css">


<!-- Page CSS -->

<link rel="stylesheet"
    href="css/pages/placeholder.css">


</head>

<body>
<!-- ========================= -->
<!-- Navbar -->
<!-- ========================= -->

<nav class="navbar">

    <div class="logo">
        AniShelf
    </div>


    <button
        class="nav-toggle"
        id="navToggle"
        aria-label="Open navigation"
        aria-expanded="false">

        ☰

    </button>


    <ul
        class="nav-links"
        id="navLinks">

    </ul>

</nav>


<!-- ========================= -->
<!-- Community -->
<!-- ========================= -->

<main class="placeholder-page">

    <section class="placeholder-card">

       <div class="placeholder-icon">
            🌐
        </div>

        <span class="placeholder-badge">
            Coming Soon
        </span>

        <h1>
            AniShelf Community
        </h1>

        <p>
            Share your anime lists with the AniShelf community.
            Publish the lists you've created, discover lists from
            other anime fans, and see what everyone else is watching.
        </p>

        <div class="placeholder-features">

        
        <div>
            <span>📚</span>
            Publish Lists
        </div>

        <div>
            <span>❤️</span>
            Like Lists
        </div>

        <div>
            <span>💬</span>
            Comment
        </div>

    </section>

</main>


<!-- ========================= -->
<!-- JavaScript -->
<!-- ========================= -->

<script src="js/api/authApi.js"></script>

<script src="js/componenets/navbar.js"></script>

</body>

</html>
