<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>AniShelf | Profile</title>


<link rel="stylesheet" href="css/base/global.css">
<link rel="stylesheet" href="css/base/reset.css">
<link rel="stylesheet" href="css/base/variable.css">

<link rel="stylesheet" href="css/components/shelves.css">
<link rel="stylesheet" href="css/components/navbar.css">

<link rel="stylesheet" href="css/pages/profile.css">

</head>

<body>
<!-- ========================= -->
<!-- Navbar -->
<!-- ========================= -->

<nav class="navbar">

    <div class="logo">
        AniShelf
    </div>


    <button
        class="nav-toggle"
        id="navToggle"
        aria-label="Open navigation"
        aria-expanded="false">

        ☰

    </button>


    <ul
        class="nav-links"
        id="navLinks">

    </ul>

</nav>


<!-- ========================= -->
<!-- Profile -->
<!-- ========================= -->

<main class="profile-page">


    <section class="profile-card">
       <!-- Profile Header -->

        <div class="profile-header">

            <div class="profile-avatar-wrapper">

                <div
                    class="profile-avatar"
                    id="profileAvatar"
                >
                    👤
                </div>

                <label
                    class="profile-upload"
                    for="profileImageInput"
                >
                    📷
                </label>

                <input
                    type="file"
                    id="profileImageInput"
                    accept="image/*"
                    hidden
                >

            </div>


            <h1 id="username">
                User
            </h1>


            <p id="email">
                email@example.com
            </p>

        </div>


        <!-- ========================= -->
        <!-- PROFILE STATS -->
        <!-- ========================= -->

        <div class="profile-stats">

            <div class="profile-stat">

                <strong id="listCount">
                    0
                </strong>

                <span>
                    My Lists
                </span>

            </div>


            <div class="profile-stat">

                <strong id="publishedCount">
                    0
                </strong>

                <span>
                    Published
                </span>

            </div>


            <div class="profile-stat">

                <strong id="savedCount">
                    0
                </strong>

                <span>
                    Saved Lists
                </span>

            </div>

        </div>


        
        <!-- saved list from the community !>
        <! ========================= -->

        <section class="profile-section">

            <div class="profile-section-header">

                <h2>
                   saved list
                </h2>

            </div>


            <div
                class="my-lists"
                id="myLists"
            >

                <p class="empty-state">
                    Loading your lists...
                </p>

            </div>

        </section>


        <!-- ========================= -->
        <!-- ACTIONS -->
        <!-- ========================= -->

        <div class="profile-actions">

            <button
                class="logout-btn"
                id="logoutBtn"
            >
                Logout
            </button>

        </div>

    </section>


</main>


<script src="js/api/authApi.js"></script>
<script src="js/api/listApi.js"></script>

<script src="js/componenets/navbar.js"></script>

<script src="js/pages/profile.js"></script>
```

</body>

</html>
